name: Quality Pipeline Gate (CI/CD)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-lint:
    name: 🔍 Static Analysis & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Strict TypeScript Check (arch-contract)
        run: npm run lint

      - name: 2. Security Audit (Dependencies)
        run: npm audit --audit-level=high || true

  unit-and-integration-tests:
    name: 🧪 Unit & Integration Tests (Vitest & Codecov)
    runs-on: ubuntu-latest
    needs: [code-quality-and-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

  build-and-performance-gate:
    name: 🚀 Production Build & Performance Budget Gate
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle
        run: npm run build

      - name: Check Performance Budget (Bundle Size Limit)
        run: |
          MAX_SIZE_KB=1500
          TOTAL_SIZE=$(du -sk dist | awk '{print $1}')
          echo "Current dist bundle size: ${TOTAL_SIZE}KB (Threshold: ${MAX_SIZE_KB}KB)"
          if [ $TOTAL_SIZE -gt $MAX_SIZE_KB ]; then
            echo "❌ Bundle size exceeded budget!"; exit 1;
          fi
          echo "✅ Performance budget respected."
